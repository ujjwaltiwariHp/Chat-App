<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Socket.IO chat</title>
  <style>
    body {
      margin: 0;
      padding-bottom: 3rem;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #111b21;
      color: #e9edef;
    }

    #messages {
      list-style-type: none;
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    #messages > li {
      max-width: 70%;
      padding: 0.5rem 0.75rem;
      border-radius: 0.7rem;
      font-size: 0.95rem;
      word-wrap: break-word;
      display: inline-block;
    }

    .sent {
      align-self: flex-end;
      background-color: #005c4b;
      color: white;
      border-bottom-right-radius: 0;
    }

    .received {
      align-self: flex-start;
      background-color: #202c33;
      color: white;
      border-bottom-left-radius: 0;
    }

    #form {
      background: #202c33;
      padding: 0.4rem;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 0.5rem;
      height: 3rem;
      box-sizing: border-box;
      border-top: 1px solid #2a3942;
    }

    #input {
      flex-grow: 1;
      border: none;
      padding: 0 1rem;
      border-radius: 20px;
      background-color: #2a3942;
      color: white;
    }

    #input::placeholder {
      color: #aebac1;
    }

    #input:focus {
      outline: none;
    }

    #form > button {
      background: #005c4b;
      border: none;
      padding: 0 1rem;
      border-radius: 3px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #3b4a54;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #111b21;
    }
  </style>
</head>
<body>
  <ul id="messages"></ul>
  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Type your message..." />
    <button type="submit">Send</button>
    <button type="button" id="toggle-btn">Disconnect</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let counter = 0;
    const sentOffsets = new Set();
    const socket = io({
      auth: {
        serverOffset: 0
      },
      ackTimeout: 10000,
      retries: 3,
    });

    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const toggleButton = document.getElementById('toggle-btn');

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const h = hours % 12 || 12;
      const ampm = hours >= 12 ? 'PM' : 'AM';
      return `${h}:${minutes.toString().padStart(2, '0')} ${ampm}`;
    }

    function scrollToBottom() {
      window.scrollTo(0, document.body.scrollHeight);
    }

    function addMessage(text, type, timestamp) {
      const item = document.createElement('li');
      const time = timestamp ? formatTime(timestamp) : '';
      item.innerHTML = `
        <div>${text}</div>
        <div style="font-size: 0.7rem; color: #aebac1; text-align: right; margin-top: 0.2rem;">
          ${time}
        </div>
      `;
      item.classList.add(type);
      messages.appendChild(item);
      scrollToBottom();
    }

    toggleButton.addEventListener('click', (e) => {
      e.preventDefault();
      if (socket.connected) {
        toggleButton.innerText = 'Connect';
        socket.disconnect();
      } else {
        toggleButton.innerText = 'Disconnect';
        socket.connect();
      }
    });

    fetch('/recent_messages')
      .then(response => response.json())
      .then(data => {
        data.forEach(msg => {
          addMessage(msg.content, 'received', msg.timestamp);
        });
        scrollToBottom();
      });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value) {
        const clientOffset = `${socket.id}-${counter++}`;
        sentOffsets.add(clientOffset);
        socket.emit('chat message', input.value, clientOffset);
        addMessage(input.value, 'sent', new Date().toISOString());
        input.value = '';
      }
    });

    socket.on('chat message', (msg) => {
      if (sentOffsets.has(msg.client_offset)) return;
      addMessage(msg.content, 'received', msg.timestamp);
    });
  </script>
</body>
</html>
